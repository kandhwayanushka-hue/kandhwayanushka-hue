    <text x="20" y="34" fill="#e6edf3" font-size="14" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,Helvetica,Arial,sans-serif">&#x1F50D; Curious about: AI, data science, full-stack development, open-source</text>
