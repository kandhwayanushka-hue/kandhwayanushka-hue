  <style>
    .c{animation:f 3s ease-in-out infinite}
    @keyframes f{0%,100%{transform:translateY(0)}50%{transform:translateY(-7px)}}
  </style>
  <g class="c">
    <rect x="0" y="4" width="650" height="48" rx="14" fill="#161b22" stroke="#ffd700" stroke-width="2"/>
    <text x="20" y="34" fill="#e6edf3" font-size="14" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,Helvetica,Arial,sans-serif">&#x1F331; Lifelong learner — there's always something new to explore</text>
  </g>
